<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raisa Shopy</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222
}
header{
  background:#111;
  color:white;
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:10
}
.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.logo{
  font-size:25px;
  font-weight:bold
}
.logo span{color:#ff4d8d}
.cart-btn{
  background:#ff4d8d;
  border:0;
  color:white;
  padding:10px 17px;
  border-radius:8px;
  cursor:pointer
}
.hero{
  background:linear-gradient(120deg,#111,#6b2145);
  color:white;
  padding:70px 20px;
  text-align:center
}
.hero h1{
  font-size:45px;
  margin:0 0 15px
}
.hero p{
  font-size:18px;
  margin-bottom:25px
}
.shop-btn{
  background:#ff4d8d;
  color:white;
  text-decoration:none;
  padding:13px 25px;
  border-radius:8px;
  display:inline-block
}
.container{
  max-width:1100px;
  margin:auto;
  padding:35px 20px
}
.categories{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:30px
}
.category{
  background:white;
  border:1px solid #ddd;
  padding:12px 18px;
  border-radius:25px;
  cursor:pointer
}
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}
.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px #0001
}
.product-image{
  height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:65px;
  background:#eee
}
.product-info{padding:15px}
.product-info h3{margin:0 0 8px}
.price{
  font-size:20px;
  font-weight:bold;
  margin:10px 0
}
.add{
  width:100%;
  padding:11px;
  border:0;
  background:#111;
  color:white;
  border-radius:7px;
  cursor:pointer
}
footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:30px
}
.cart{
  position:fixed;
  right:-400px;
  top:0;
  width:380px;
  max-width:100%;
  height:100%;
  background:white;
  z-index:100;
  padding:20px;
  box-shadow:-5px 0 20px #0003;
  transition:.3s
}
.cart.open{right:0}
.close{
  float:right;
  border:0;
  background:#eee;
  padding:8px 12px;
  cursor:pointer
}
.cart-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:12px 0
}
.whatsapp{
  width:100%;
  padding:14px;
  background:#25D366;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
@media(max-width:800px){
  .products{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .products{grid-template-columns:1fr 1fr;gap:10px}
  .hero h1{font-size:32px}
  .cart{width:100%}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">Raisa <span>Shopy</span></div>
<button class="cart-btn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>
</div>
</header>

<section class="hero">
<h1>Welcome to Raisa Shopy</h1>
<p>Clothes • Electronics • Cosmetics • More</p>
<a href="#products" class="shop-btn">Shop Now</a>
</section>

<div class="container">

<h2>Categories</h2>

<div class="categories">
<button class="category" onclick="showProducts('all')">🛍️ All</button>
<button class="category" onclick="showProducts('Clothes')">👗 Clothes</button>
<button class="category" onclick="showProducts('Electronics')">📱 Electronics</button>
<button class="category" onclick="showProducts('Cosmetics')">💄 Cosmetics</button>
</div>

<h2 id="products">Products</h2>

<div class="products" id="productList"></div>

</div>

<div class="cart" id="cart">

<button class="close" onclick="closeCart()">✕</button>

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<h3>Total: SAR <span id="total">0</span></h3>

<button class="whatsapp" onclick="sendWhatsApp()">
📲 Order on WhatsApp
</button>

</div>

<footer>
<strong>Raisa Shopy</strong>
<br><br>
Clothes • Electronics • Cosmetics
<br><br>
© 2026 Raisa Shopy
</footer>

<script>

const whatsapp="966563747461";

const products=[

{id:1,name:"Elegant Dress",category:"Clothes",price:89,icon:"👗"},
{id:2,name:"Classic Handbag",category:"Clothes",price:75,icon:"👜"},
{id:3,name:"Smart Phone",category:"Electronics",price:699,icon:"📱"},
{id:4,name:"Wireless Earbuds",category:"Electronics",price:99,icon:"🎧"},
{id:5,name:"Smart Watch",category:"Electronics",price:149,icon:"⌚"},
{id:6,name:"Beauty Makeup Set",category:"Cosmetics",price:59,icon:"💄"},
{id:7,name:"Perfume",category:"Cosmetics",price:85,icon:"🌸"},
{id:8,name:"Skin Care Set",category:"Cosmetics",price:69,icon:"🧴"}

];

let cart=[];

function showProducts(category="all"){

let list=products.filter(p =>
category==="all" || p.category===category
);

document.getElementById("productList").innerHTML=list.map(p=>`

<div class="product">

<div class="product-image">${p.icon}</div>

<div class="product-info">

<h3>${p.name}</h3>

<div>${p.category}</div>

<div class="price">SAR ${p.price}</div>

<button class="add" onclick="addToCart(${p.id})">
Add to Cart
</button>

</div>

</div>

`).join("");

}

function addToCart(id){

let product=products.find(p=>p.id===id);

cart.push(product);

updateCart();

openCart();

}

function updateCart(){

document.getElementById("cartCount").innerText=cart.length;

let total=0;

document.getElementById("cartItems").innerHTML=

cart.length ?

cart.map((p,i)=>{

total+=p.price;

return `

<div class="cart-item">

<span>${p.icon} ${p.name}</span>

<strong>SAR ${p.price}</strong>

</div>

`;

}).join("") :

"<p>Your cart is empty.</p>";

document.getElementById("total").innerText=total;

}

function openCart(){
document.getElementById("cart").classList.add("open");
}

function closeCart(){
document.getElementById("cart").classList.remove("open");
}

function sendWhatsApp(){

if(cart.length===0){

alert("Please add a product first.");

return;

}

let message="Hello Raisa Shopy!%0A%0AI would like to order:%0A%0A";

let total=0;

cart.forEach(p=>{

message+=
"• "+p.name+
" - SAR "+p.price+
"%0A";

total+=p.price;

});

message+=
"%0ATotal: SAR "+total+
"%0A%0APlease confirm my order.";

window.open(
"https://wa.me/"+whatsapp+"?text="+message,
"_blank"
);

}

showProducts();

</script>

</body>
</html>
